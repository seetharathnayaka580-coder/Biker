  <path d="M22 45 L38 46 L46 52 L34 52 Z" fill="#161b24" stroke="#2c3545" stroke-width="1" />
  <path d="M21 44 L25 45 L23 47 Z" fill="#ef4444" />
  <path d="M28 44 Q36 45 42 47 L38 50 L30 47 Z" fill="#0b0e14" />
  
  <!-- Tank & Shrouds (Brooklyn Black with Red Decal) -->
  <path d="M44 50 Q50 38 60 38 Q66 39 68 44 Q64 54 56 55 Z" fill="#161a22" stroke="#384252" stroke-width="1.5" />
