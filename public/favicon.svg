<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#07090c" />
    </linearGradient>
    <linearGradient id="favAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="favRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Dark Squircle Container -->
  <rect width="128" height="128" rx="30" fill="url(#favBg)" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.8" />
  
  <!-- Inner Glow Border -->
  <rect width="120" height="120" x="4" y="4" rx="26" fill="none" stroke="#252c3b" stroke-width="1.5" />

  <!-- MOTORCYCLE SILHOUETTE (High-Contrast Pulsar N160) -->
  <g transform="translate(4, 8)">
    <!-- Rear Wheel & Red Rim Tape -->
    <circle cx="32" cy="74" r="18" fill="#0d1017" stroke="#334155" stroke-width="3" />
    <circle cx="32" cy="74" r="12" fill="#05070a" />
    <circle cx="32" cy="74" r="11" fill="none" stroke="url(#favRed)" stroke-width="2" stroke-dasharray="10 5 15 5" />
    <circle cx="32" cy="74" r="6" fill="#1e293b" />

    <!-- Front Wheel & Red Rim Tape + ABS Disc -->
    <circle cx="92" cy="74" r="18" fill="#0d1017" stroke="#334155" stroke-width="3" />
    <circle cx="92" cy="74" r="12" fill="#05070a" />
    <circle cx="92" cy="74" r="11" fill="none" stroke="url(#favRed)" stroke-width="2" stroke-dasharray="10 5 15 5" />
    <circle cx="92" cy="74" r="7" fill="none" stroke="#94a3b8" stroke-width="2" />
    <circle cx="92" cy="74" r="3" fill="#f59e0b" />

    <!-- Rear Swingarm & Chain -->
    <path d="M32 74 L60 72 L66 60 L50 60 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Rear Mudguard -->
    <path d="M22 66 Q32 55 46 62" fill="none" stroke="#0f172a" stroke-width="3" />

    <!-- DTS-i Engine Block & Underbelly Exhaust -->
    <path d="M52 58 L76 55 L78 76 L55 76 Z" fill="#181d28" stroke="#374151" stroke-width="1.5" />
    <!-- Underbelly Exhaust Silencer -->
    <path d="M58 78 L72 78 L74 74 L60 74 Z" fill="#94a3b8" stroke="#64748b" stroke-width="1" />

    <!-- Engine Belly Cowl with Red Stripe -->
    <path d="M54 77 L78 74 L84 66 L74 80 L54 80 Z" fill="#111622" stroke="#374151" stroke-width="1" />
    <line x1="62" y1="78" x2="74" y2="76" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />

    <!-- Telescopic Front Forks -->
    <line x1="84" y1="38" x2="92" y2="74" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />
    <path d="M82 58 Q90 52 100 62" fill="none" stroke="#181d28" stroke-width="3" />

    <!-- Upswept Tail & Split Seats -->
    <path d="M26 48 L48 50 L58 58 L42 58 Z" fill="#181e2b" stroke="#334155" stroke-width="1.2" />
    <!-- Red Tail Light Tip -->
    <path d="M24 47 L30 48 L27 51 Z" fill="#ef4444" filter="url(#glow)" />
    <!-- Rider Seat Scoop -->
    <path d="M46 48 Q58 50 65 54 L60 58 L48 52 Z" fill="#080a0e" stroke="#1f2937" />

    <!-- Muscular Fuel Tank (Brooklyn Black) -->
    <path d="M56 54 Q64 38 78 38 Q85 39 88 47 Q80 60 70 61 Z" fill="#181e2b" stroke="#3b485d" stroke-width="1.5" />
    <!-- Extended Tank Shroud Wing -->
    <path d="M70 41 L88 44 L90 56 L78 60 Z" fill="#0e121b" stroke="#ef4444" stroke-width="1.2" />
    <!-- N160 Red Slash Graphic -->
    <line x1="68" y1="44" x2="85" y2="47" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />

    <!-- Bi-Functional LED Projector Headlamp -->
    <path d="M88 38 L96 40 L101 48 L94 53 L89 47 Z" fill="#181e2b" stroke="#374151" stroke-width="1" />
    <!-- LED DRL Brow -->
    <line x1="93" y1="41" x2="98" y2="44" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <!-- Projector Eye (Cyan) -->
    <circle cx="96" cy="47" r="2.5" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8" filter="url(#glow)" />
    <!-- Handlebar & Mirror -->
    <path d="M82 36 L88 34 L90 36" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="84" y1="34" x2="80" y2="28" stroke="#475569" stroke-width="1.2" />
  </g>

  <!-- URL LOGO / BRAND TEXT PILL (N160) -->
  <g transform="translate(64, 108)">
    <rect x="-42" y="-12" width="84" height="20" rx="6" fill="#080a0f" stroke="#f59e0b" stroke-width="1.2" />
    <text x="-2" y="2" font-family="'Rajdhani', sans-serif, system-ui" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      PULSAR <tspan fill="#f59e0b" font-weight="900">N160</tspan>
    </text>
  </g>
</svg>
