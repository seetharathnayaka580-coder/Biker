      <stop offset="0%" stop-color="#0f1219" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="favAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- Base Squircle -->
  <rect width="100" height="100" rx="24" fill="url(#favBg)" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.8" />
  
  <!-- Wheels -->
  <!-- Rear Wheel -->
  <circle cx="28" cy="65" r="14" fill="#11141b" stroke="#334155" stroke-width="2.5" />
  <circle cx="28" cy="65" r="9" fill="#090b0e" />
  <circle cx="28" cy="65" r="8" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="8 4" />
  <!-- Front Wheel -->
  <circle cx="74" cy="65" r="14" fill="#11141b" stroke="#334155" stroke-width="2.5" />
  <circle cx="74" cy="65" r="9" fill="#090b0e" />
  <circle cx="74" cy="65" r="8" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="8 4" />
  <!-- Discs -->
  <circle cx="74" cy="65" r="5" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Swingarm & Engine -->
  <path d="M28 65 L48 64 L54 55 L42 55 Z" fill="#1e293b" />
