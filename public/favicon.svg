<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Carbon Metallic Background -->
    <radialGradient id="iconBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#182030" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Beveled Gold & Chrome Frame -->
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Crimson Nitro Red -->
    <linearGradient id="nitroRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d5a" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Cyber Cyan Headlight Glow -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Chrome Metallic Sheen -->
    <linearGradient id="chromeSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter Glows -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="crispGlowSmall" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Base App Squircle Container with Premium Gold Bevel Border -->
  <rect width="512" height="512" rx="120" fill="url(#iconBg)" />
  
  <!-- Carbon Fiber Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="64" x2="512" y2="64" stroke-dasharray="8 8" />
    <line x1="0" y1="128" x2="512" y2="128" stroke-dasharray="8 8" />
    <line x1="0" y1="192" x2="512" y2="192" stroke-dasharray="8 8" />
    <line x1="0" y1="256" x2="512" y2="256" stroke-dasharray="8 8" />
    <line x1="0" y1="320" x2="512" y2="320" stroke-dasharray="8 8" />
    <line x1="0" y1="384" x2="512" y2="384" stroke-dasharray="8 8" />
    <line x1="0" y1="448" x2="512" y2="448" stroke-dasharray="8 8" />
  </g>

  <!-- Metallic Gold Border Ring -->
  <rect width="496" height="496" x="8" y="8" rx="112" fill="none" stroke="url(#goldBevel)" stroke-width="7" />
  <rect width="476" height="476" x="18" y="18" rx="104" fill="none" stroke="#000000" stroke-width="3" opacity="0.8" />
  <rect width="468" height="468" x="22" y="22" rx="100" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Atmospheric Amber/Cyan Lighting Flare -->
  <circle cx="256" cy="180" r="140" fill="#38bdf8" opacity="0.08" filter="url(#neonGlow)" />
  <circle cx="256" cy="270" r="160" fill="#f59e0b" opacity="0.06" filter="url(#neonGlow)" />

  <!-- ================= ICON CENTERPIECE: PULSAR N160 HEADLAMP VISOR + WOLF EYES ================= -->
  <g filter="url(#dropShadow)" transform="translate(0, -10)">
    
    <!-- Aerodynamic Front Fairing Mask -->
    <path d="M176 100 L336 100 L370 160 L320 250 L256 310 L192 250 L142 160 Z" fill="#111622" stroke="#2a364a" stroke-width="4" />
    <!-- Smoked Windscreen / Flyscreen -->
    <path d="M196 100 L316 100 L340 145 L256 160 L172 145 Z" fill="#090c12" stroke="#475569" stroke-width="2" />
    <path d="M220 106 L292 106 L306 132 L256 142 L206 132 Z" fill="#1e293b" opacity="0.6" />

    <!-- Left & Right Wolf-Eye LED DRL Brows (Signature Pulsar N-Series) -->
    <!-- Left DRL Brow -->
    <path d="M170 170 Q215 180 238 220 L230 226 Q205 195 162 182 Z" fill="#ffffff" filter="url(#crispGlowSmall)" />
    <path d="M170 170 Q215 180 238 220 L230 226 Q205 195 162 182 Z" fill="url(#cyanNeon)" opacity="0.9" />

    <!-- Right DRL Brow -->
    <path d="M342 170 Q297 180 274 220 L282 226 Q307 195 350 182 Z" fill="#ffffff" filter="url(#crispGlowSmall)" />
    <path d="M342 170 Q297 180 274 220 L282 226 Q307 195 350 182 Z" fill="url(#cyanNeon)" opacity="0.9" />

    <!-- Bi-LED Projector Lens Center Eye -->
    <circle cx="256" cy="245" r="32" fill="#070a0f" stroke="#334155" stroke-width="4" />
    <circle cx="256" cy="245" r="24" fill="#0284c7" filter="url(#neonGlow)" />
    <circle cx="256" cy="245" r="16" fill="#38bdf8" />
    <circle cx="256" cy="245" r="9" fill="#ffffff" />
    <circle cx="251" cy="240" r="4" fill="#ffffff" />

    <!-- Sharp Side Air Intake Ducts -->
    <polygon points="152,190 180,210 170,240 145,215" fill="#0a0d14" stroke="#e11d48" stroke-width="2" />
    <polygon points="360,190 332,210 342,240 367,215" fill="#0a0d14" stroke="#e11d48" stroke-width="2" />
  </g>

  <!-- ================= TYPOGRAPHY / EMBLEM ================= -->
  <!-- "PULSAR" High-Tracking Speed Typography -->
  <text x="256" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="8" filter="url(#crispGlowSmall)">
    PULSAR
  </text>
  <text x="256" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="8">
    PULSAR
  </text>

  <!-- "N160" Bold Dynamic 3D Badge -->
  <g transform="translate(256, 435)">
    <!-- Plate container -->
    <rect x="-140" y="-35" width="280" height="52" rx="16" fill="#0d111a" stroke="url(#goldBevel)" stroke-width="2.5" />
    
    <!-- Red Dual ABS Tag on right -->
    <rect x="52" y="-22" width="76" height="26" rx="6" fill="url(#nitroRed)" />
    <text x="90" y="-4" text-anchor="middle" font-family="monospace" font-weight="900" font-size="12" fill="#ffffff" letter-spacing="1">
      ABS 2CH
    </text>

    <!-- N160 Text -->
    <text x="-35" y="4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="url(#goldBevel)" letter-spacing="3">
      N160
    </text>
  </g>

  <!-- Top Lighting Glint -->
  <path d="M120 40 Q256 15 392 40" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3" />
</svg>
