<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3240" />
      <stop offset="40%" stop-color="#161922" />
      <stop offset="100%" stop-color="#090b10" />
    </linearGradient>
    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle / Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.3" />
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="#2a3040" stroke-width="2" />

  <!-- Speed lines background subtle -->
  <path d="M40 380 L472 380" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="16 8" />
  <path d="M60 400 L452 400" stroke="#ef4444" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- BAJAJ PULSAR N160 DETAILED MOTORCYCLE VECTOR (Side-Streetfighter Stance) -->
  <g transform="translate(10, 10)">
    <!-- Shadow beneath bike -->
    <ellipse cx="246" cy="378" rx="190" ry="18" fill="#000000" opacity="0.75" filter="url(#glow)" />

    <!-- REAR WHEEL & TIRE -->
    <g id="rear-wheel">
      <!-- Outer Tire -->
      <circle cx="115" cy="320" r="62" fill="#12151c" stroke="#1e2430" stroke-width="4" />
      <circle cx="115" cy="320" r="54" fill="#0d0f15" />
      <!-- Rim -->
      <circle cx="115" cy="320" r="42" fill="url(#rimGrad)" stroke="#475569" stroke-width="2" />
      <!-- N160 Red Rim Tape Accent -->
      <circle cx="115" cy="320" r="41" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="25 15 35 15" />
      <!-- Rear Brake Disc -->
      <circle cx="115" cy="320" r="26" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 3" />
      <!-- Rim Spokes (Sporty Alloy) -->
      <path d="M115 320 L115 278 M115 320 L115 362 M115 320 L78 300 M115 320 L152 340 M115 320 L78 340 M115 320 L152 300" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round" />
      <!-- Hub -->
      <circle cx="115" cy="320" r="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    </g>

    <!-- FRONT WHEEL & TIRE -->
    <g id="front-wheel">
      <!-- Outer Tire -->
      <circle cx="375" cy="320" r="62" fill="#12151c" stroke="#1e2430" stroke-width="4" />
      <circle cx="375" cy="320" r="54" fill="#0d0f15" />
      <!-- Rim -->
      <circle cx="375" cy="320" r="42" fill="url(#rimGrad)" stroke="#475569" stroke-width="2" />
      <!-- N160 Red Rim Tape Accent -->
      <circle cx="375" cy="320" r="41" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="25 15 35 15" />
      <!-- Front Large Petal Disc (300mm Dual Channel ABS Disc) -->
      <circle cx="375" cy="320" r="32" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="7 2" />
      <!-- ABS Ring -->
      <circle cx="375" cy="320" r="18" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2" />
      <!-- Front Rim Spokes -->
      <path d="M375 320 L375 278 M375 320 L375 362 M375 320 L338 300 M375 320 L412 340 M375 320 L338 340 M375 320 L412 300" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round" />
      <!-- Hub -->
      <circle cx="375" cy="320" r="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    </g>

    <!-- REAR SWINGARM & DRIVE CHAIN -->
    <path d="M115 320 L205 315 L230 285 L180 280 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M115 320 L195 270" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.8" />
    <!-- Rear Hugger / Mudguard -->
    <path d="M90 290 Q120 255 160 270 Q130 275 105 305 Z" fill="#0f172a" stroke="#1e293b" />

    <!-- ENGINE & CRANKCASE (164.82cc Oil-Cooled Engine) -->
    <!-- Underbelly Exhaust (N160 signature) -->
    <path d="M210 338 L255 338 Q268 338 272 328 L258 322 L210 324 Z" fill="url(#metalGrad)" stroke="#64748b" stroke-width="1.5" />
    <ellipse cx="266" cy="330" rx="4" ry="6" fill="#0f172a" />
    
    <!-- Engine Block & Cooling Fins -->
    <path d="M195 260 L275 255 L285 315 L200 325 Z" fill="#181e29" stroke="#334155" stroke-width="2" />
    <!-- Engine Fins -->
    <line x1="210" y1="270" x2="265" y2="267" stroke="#475569" stroke-width="2" />
    <line x1="208" y1="280" x2="268" y2="277" stroke="#475569" stroke-width="2" />
    <line x1="206" y1="290" x2="270" y2="287" stroke="#475569" stroke-width="2" />
    <line x1="204" y1="300" x2="272" y2="297" stroke="#475569" stroke-width="2" />
    <!-- Oil Cooler Radiator (front of engine) -->
    <rect x="282" y="245" width="12" height="38" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
    <line x1="285" y1="250" x2="285" y2="278" stroke="#ef4444" stroke-width="1" />

    <!-- ENGINE COWL / BELLY PAN (Aggressive sporty aerodynamic chin) -->
    <path d="M195 328 L285 320 L305 295 L275 335 L195 335 Z" fill="url(#tankGrad)" stroke="#384252" stroke-width="1.5" />
    <path d="M220 332 L260 326" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />

    <!-- PERIMETER FRAME / CHASSIS (Dual Tone) -->
    <path d="M190 245 L255 240 L280 215 L230 215 Z" fill="#334155" stroke="#475569" stroke-width="2" />

    <!-- FRONT FORK (37mm Telescopic Suspension) -->
    <g id="front-forks">
      <!-- Upper Fork Stanchion -->
      <line x1="345" y1="185" x2="368" y2="275" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
      <!-- Lower Fork Slider -->
      <line x1="365" y1="265" x2="375" y2="320" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
      <circle cx="375" cy="320" r="6" fill="#64748b" />
      <!-- Front Fender / Mudguard (Brooklyn Black with red tip) -->
      <path d="M335 255 Q365 240 405 270 Q370 252 342 270 Z" fill="url(#tankGrad)" stroke="#334155" stroke-width="1.5" />
      <path d="M395 264 L404 269" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- REAR MONOSHOCK (Nitrox Sub-tank) -->
    <rect x="188" y="260" width="10" height="24" rx="3" transform="rotate(-30 188 260)" fill="#ef4444" stroke="#dc2626" stroke-width="1" />

    <!-- REAR TAIL & SPLIT SEAT (N160 Streetfighter Shape) -->
    <!-- Rear Subframe & Tail Cowl -->
    <path d="M100 210 L175 220 L210 245 L155 245 Z" fill="url(#tankGrad)" stroke="#2d3748" stroke-width="2" />
    <!-- Sharp LED Tail Tip -->
    <path d="M96 208 L115 212 L105 218 Z" fill="#ef4444" filter="url(#subtleGlow)" />
    <!-- Split Grab Rails (Signature Pulsar Horn Grabrails) -->
    <path d="M120 200 L155 208 L150 214 L125 208 Z" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <!-- Pillion Seat -->
    <path d="M125 205 Q150 208 175 215 L170 223 L130 216 Z" fill="#0b0d13" stroke="#1f242f" />
    <!-- Rider Seat (Ergonomic Scoop) -->
    <path d="M175 215 Q215 222 235 242 L215 245 L175 225 Z" fill="#0a0c11" stroke="#1f242f" stroke-width="1.5" />

    <!-- MUSCULAR FUEL TANK (Sculpted with Extended Aerodynamic Shrouds) -->
    <path d="M225 240 Q245 195 295 190 Q325 192 340 215 Q325 255 285 260 Q250 260 225 240 Z" fill="url(#tankGrad)" stroke="#334155" stroke-width="2" />
    <!-- Tank Shroud Extension (Sharp forward wing) -->
    <path d="M290 198 L345 205 L355 245 L320 262 L295 245 Z" fill="#111520" stroke="#3b4252" stroke-width="1.5" />
    <!-- Tank Graphics / Pulsar N160 Red Decal Accent -->
    <path d="M270 205 L325 208 L345 235" fill="none" stroke="url(#accentRed)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M290 222 L330 224" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <!-- Aircraft Style Fuel Filler Cap -->
    <ellipse cx="282" cy="194" rx="10" ry="4" fill="#475569" stroke="#94a3b8" stroke-width="1" />

    <!-- HEADLIGHT CLUSTER & MASK (Signature Bi-Functional LED Projector with Wolf-Eye DRLs) -->
    <g id="headlamp-mask">
      <!-- Aggressive Headlight Fairing -->
      <path d="M335 180 L365 182 L385 208 L360 230 L342 205 Z" fill="url(#tankGrad)" stroke="#334155" stroke-width="1.5" />
      <!-- Wolf-Eye LED DRL Brows -->
      <path d="M362 190 L380 200" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" filter="url(#subtleGlow)" />
      <!-- Central Projector LED Lens (Gleaming white-cyan beam) -->
      <circle cx="374" cy="208" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
      <circle cx="374" cy="208" r="3" fill="#ffffff" />
      <!-- Tinted Flyscreen / Visor -->
      <path d="M340 178 L355 158 L368 180 Z" fill="#020617" stroke="#1e293b" />
    </g>

    <!-- HANDLEBARS & CONTROLS -->
    <!-- Handlebar Bar -->
    <path d="M328 178 L348 172 L360 174" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />
    <!-- Bar End & Throttle Grip -->
    <rect x="320" y="174" width="10" height="6" rx="2" fill="#0f172a" stroke="#475569" />
    <!-- Rearview Mirror (Sporty angular) -->
    <path d="M338 172 L330 148 L312 144 L322 156 Z" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <!-- Digital Instrument Console (Infinity Display) -->
    <rect x="342" y="166" width="14" height="8" rx="2" fill="#0369a1" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- N160 SPEED BADGE (Embossed Bottom Overlay) -->
  <g transform="translate(256, 435)">
    <!-- Plate backing -->
    <rect x="-140" y="-22" width="280" height="44" rx="14" fill="#0a0c10" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6" />
    
    <text x="-95" y="6" font-family="'Rajdhani', 'Impact', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="3">
      PULSAR
    </text>
    <text x="35" y="8" font-family="'Rajdhani', 'Impact', sans-serif" font-size="26" font-weight="900" fill="#f59e0b" letter-spacing="2">
      N160
    </text>

    <!-- ABS Dual-Channel Pip -->
    <circle cx="115" cy="0" r="4" fill="#ef4444" filter="url(#subtleGlow)" />
  </g>
</svg>
