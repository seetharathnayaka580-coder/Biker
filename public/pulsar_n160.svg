<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient Studio Floor -->
    <radialGradient id="studioFloor" cx="50%" cy="65%" r="75%">
      <stop offset="0%" stop-color="#141924" />
      <stop offset="50%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#040609" />
    </radialGradient>

    <!-- Metallic Black Bodywork (Brooklyn Black) -->
    <linearGradient id="brooklynBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475266" />
      <stop offset="20%" stop-color="#2a3240" />
      <stop offset="60%" stop-color="#161b24" />
      <stop offset="100%" stop-color="#090b0f" />
    </linearGradient>

    <!-- Tank Shroud Satin Finish -->
    <linearGradient id="tankShroud" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3b4453" />
      <stop offset="35%" stop-color="#212733" />
      <stop offset="100%" stop-color="#0e1118" />
    </linearGradient>

    <!-- Golden USD Inverted Forks -->
    <linearGradient id="goldForks" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Racing Red / Crimson Decals -->
    <linearGradient id="pulsarRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b4d" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Chrome & Stainless Exhaust -->
    <linearGradient id="chromeSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Headlight Beam Cone Gradient -->
    <linearGradient id="beamGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Stage Background with Beveled Border -->
  <rect width="800" height="560" rx="36" fill="url(#studioFloor)" />
  <rect width="794" height="554" x="3" y="3" rx="33" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" />

  <!-- Studio Floor Speed Lines & Perspective Grid -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="1.2">
    <line x1="60" y1="440" x2="740" y2="440" />
    <line x1="40" y1="470" x2="760" y2="470" stroke-dasharray="16 8" />
    <line x1="20" y1="505" x2="780" y2="505" stroke-dasharray="24 12" />
    <!-- Angular Perspective grid lines -->
    <line x1="400" y1="360" x2="100" y2="540" opacity="0.4" />
    <line x1="400" y1="360" x2="250" y2="540" opacity="0.4" />
    <line x1="400" y1="360" x2="550" y2="540" opacity="0.4" />
    <line x1="400" y1="360" x2="700" y2="540" opacity="0.4" />
  </g>

  <!-- Ambient Headlight Beam Cast onto Floor (Cyan Projector Beam) -->
  <polygon points="610,215 790,260 790,380 610,240" fill="url(#beamGlow)" opacity="0.45" filter="url(#softGlow)" />

  <!-- Motorcycle Ground Shadow with Ambient Occlusion -->
  <ellipse cx="380" cy="445" rx="310" ry="24" fill="#000000" opacity="0.95" filter="url(#softGlow)" />
  <ellipse cx="380" cy="442" rx="260" ry="14" fill="#000000" opacity="0.98" />

  <!-- ================= BAJAJ PULSAR N160 HIGH DEFINITION MOTORCYCLE ================= -->
  <g id="pulsar-n160-full" transform="translate(20, 10)">
    
    <!-- 1. REAR WHEEL & BRAKE ASSEMBLY -->
    <g id="rear-wheel">
      <!-- 130/70 R17 Radial Tire -->
      <circle cx="160" cy="345" r="95" fill="#090c10" stroke="#1c2330" stroke-width="6" />
      <circle cx="160" cy="345" r="82" fill="#040608" />
      
      <!-- 17-inch Alloy Rim -->
      <circle cx="160" cy="345" r="65" fill="#131822" stroke="#2b3545" stroke-width="3" />
      
      <!-- Crimson & Amber Racing Rim Decal Stripes -->
      <circle cx="160" cy="345" r="63" fill="none" stroke="url(#pulsarRed)" stroke-width="4" stroke-dasharray="45 25 55 25" stroke-linecap="round" />
      <circle cx="160" cy="345" r="63" fill="none" stroke="url(#goldForks)" stroke-width="2" stroke-dasharray="15 80" stroke-linecap="round" opacity="0.8" />
      
      <!-- 230mm Rear Petal Disc Rotor -->
      <circle cx="160" cy="345" r="38" fill="none" stroke="#94a3b8" stroke-width="5" stroke-dasharray="8 4" />
      <circle cx="160" cy="345" r="24" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4" />
      
      <!-- 5-Spoke Star Alloy Wheels -->
      <path d="M160 345 L160 282 M160 345 L160 408 M160 345 L105 312 M160 345 L215 378 M160 345 L105 378 M160 345 L215 312" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />
      <circle cx="160" cy="345" r="16" fill="#0c0f16" stroke="#f59e0b" stroke-width="2.5" />
      <circle cx="160" cy="345" r="6" fill="#f59e0b" />
    </g>

    <!-- 2. FRONT WHEEL & 300mm DUAL ABS ROTOR -->
    <g id="front-wheel">
      <!-- 100/80 R17 Front Tire -->
      <circle cx="585" cy="345" r="95" fill="#090c10" stroke="#1c2330" stroke-width="6" />
      <circle cx="585" cy="345" r="82" fill="#040608" />
      
      <!-- Front 17-inch Alloy Rim -->
      <circle cx="585" cy="345" r="65" fill="#131822" stroke="#2b3545" stroke-width="3" />
      
      <!-- Racing Rim Decal -->
      <circle cx="585" cy="345" r="63" fill="none" stroke="url(#pulsarRed)" stroke-width="4" stroke-dasharray="45 25 55 25" stroke-linecap="round" />
      <circle cx="585" cy="345" r="63" fill="none" stroke="url(#goldForks)" stroke-width="2" stroke-dasharray="15 80" stroke-linecap="round" opacity="0.8" />
      
      <!-- Massive 300mm Front Petal Disc Brake with ABS Slotted Tone Ring -->
      <circle cx="585" cy="345" r="50" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-dasharray="10 4" />
      <circle cx="585" cy="345" r="32" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="4 3" />
      <!-- Brembo/ByBre Brake Caliper (Dual Channel ABS) -->
      <path d="M555 315 L575 305 L585 330 L565 340 Z" fill="#b91c1c" stroke="#fca5a5" stroke-width="1.2" />
      
      <!-- Front Alloy Spokes -->
      <path d="M585 345 L585 282 M585 345 L585 408 M585 345 L530 312 M585 345 L640 378 M585 345 L530 378 M585 345 L640 312" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />
      <circle cx="585" cy="345" r="16" fill="#0c0f16" stroke="#f59e0b" stroke-width="2.5" />
      <circle cx="585" cy="345" r="6" fill="#f59e0b" />
    </g>

    <!-- 3. REAR SWINGARM, CHAIN DRIVE & MONOSHOCK -->
    <g id="swingarm">
      <!-- Box-section Swingarm -->
      <path d="M160 345 L320 330 L350 280 L270 280 Z" fill="#18202d" stroke="#334155" stroke-width="2.5" />
      <!-- Drive Chain Guard -->
      <path d="M130 325 L290 310 L290 295 L140 305 Z" fill="#0b0e14" stroke="#1e293b" />
      <!-- Rear Tire Hugger / Splash Guard -->
      <path d="M110 300 Q150 240 220 280 L210 295 Q155 260 120 315 Z" fill="#0f141d" stroke="#252f40" stroke-width="1.5" />
      <!-- Nitrox Mono-Shock Absorber with Red Coil -->
      <rect x="295" y="270" width="16" height="42" rx="4" transform="rotate(-30 295 270)" fill="#1e293b" stroke="#334155" />
      <!-- Red Spring -->
      <path d="M300 275 L316 284 M304 285 L320 294 M308 295 L324 304" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- 4. ENGINE BLOCK (164.82cc Oil-Cooled DTS-i) & UNDERBELLY EXHAUST -->
    <g id="engine-block">
      <!-- Crankcase & Cylinder with Cooling Fins -->
      <path d="M290 270 L430 255 L445 365 L300 365 Z" fill="#131720" stroke="#374151" stroke-width="2" />
      <!-- Horizontal Cooling Fins -->
      <line x1="330" y1="275" x2="415" y2="265" stroke="#64748b" stroke-width="2.5" />
      <line x1="325" y1="290" x2="422" y2="280" stroke="#64748b" stroke-width="2.5" />
      <line x1="320" y1="305" x2="428" y2="295" stroke="#64748b" stroke-width="2.5" />
      <line x1="315" y1="320" x2="432" y2="310" stroke="#64748b" stroke-width="2.5" />
      
      <!-- Circular Crankcase Clutch Cover with Gold Bajaj Accent -->
      <circle cx="375" cy="335" r="28" fill="#1e2430" stroke="#475569" stroke-width="2" />
      <circle cx="375" cy="335" r="20" fill="#11141b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="375" y="339" font-family="monospace" font-weight="900" font-size="8" fill="#f59e0b" text-anchor="middle">DTS-i</text>
      
      <!-- Oil Cooler Radiator (Mounted on front frame downtube) -->
      <rect x="445" y="240" width="14" height="42" rx="3" fill="#181d28" stroke="#475569" stroke-width="1.5" />
      <line x1="447" y1="248" x2="457" y2="248" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="447" y1="256" x2="457" y2="256" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="447" y1="264" x2="457" y2="264" stroke="#38bdf8" stroke-width="1.5" />
      
      <!-- Exhaust Header Pipe from Engine to Underbelly Box -->
      <path d="M430 280 Q460 310 445 365 L370 380" fill="none" stroke="url(#chromeSteel)" stroke-width="8" stroke-linecap="round" />
      
      <!-- Underbelly Exhaust Silencer with Chrome End Cap -->
      <path d="M340 375 L415 375 L425 355 L350 355 Z" fill="url(#brooklynBlack)" stroke="#475569" stroke-width="1.5" />
      <ellipse cx="420" cy="365" rx="6" ry="9" fill="url(#chromeSteel)" stroke="#f59e0b" stroke-width="1" />
      <circle cx="420" cy="365" r="3" fill="#07090d" />

      <!-- Aggressive Engine Under-Cowl Belly Pan with Red Graphic -->
      <path d="M310 368 L440 358 L465 315 L430 385 L310 385 Z" fill="url(#tankShroud)" stroke="#374151" stroke-width="1.5" />
      <path d="M340 375 L430 365 L410 380 Z" fill="url(#pulsarRed)" />
    </g>

    <!-- 5. FRONT FORKS (GOLDEN USD / TELESCOPIC) & MUDGUARD -->
    <g id="front-suspension">
      <!-- High-Performance Golden Inverted USD Fork Tubes -->
      <line x1="535" y1="165" x2="585" y2="345" stroke="url(#goldForks)" stroke-width="9" stroke-linecap="round" />
      <line x1="525" y1="170" x2="575" y2="350" stroke="#1e293b" stroke-width="4" stroke-linecap="round" opacity="0.6" />
      
      <!-- Front Aero Mudguard (Brooklyn Black with Red Slash) -->
      <path d="M515 270 Q565 240 640 290 L630 310 Q565 265 520 295 Z" fill="url(#tankShroud)" stroke="#3b485d" stroke-width="1.5" />
      <line x1="540" y1="265" x2="590" y2="280" stroke="url(#pulsarRed)" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- 6. TAIL SECTION & DUAL SPLIT STEPPED SEATS -->
    <g id="tail-and-seats">
      <!-- Upswept Tail Cowl -->
      <path d="M140 215 L260 225 L320 265 L220 265 Z" fill="url(#brooklynBlack)" stroke="#334155" stroke-width="1.5" />
      <!-- Signature Twin Vertical LED Tail Lamps (Glowing Crimson) -->
      <path d="M135 210 L145 212 L140 226 L130 222 Z" fill="#ef4444" filter="url(#laserGlow)" />
      <!-- Rear Split Grab Rails -->
      <path d="M190 205 L245 212 L240 222 L185 215 Z" fill="#0f141d" stroke="#475569" stroke-width="1.5" />

      <!-- Pillion Stepped Seat -->
      <path d="M180 210 Q240 215 275 235 L260 245 Q210 225 175 220 Z" fill="#080a0e" stroke="#1f2937" stroke-width="1.5" />
      <!-- Rider Ergonomic Scoop Seat -->
      <path d="M265 230 Q335 240 370 255 L355 275 Q305 255 255 245 Z" fill="#080a0e" stroke="#1f2937" stroke-width="1.5" />
    </g>

    <!-- 7. MUSCULAR BROOKLYN BLACK FUEL TANK & EXTENDED SHROUDS -->
    <g id="fuel-tank">
      <!-- Main Muscular Tank Profile -->
      <path d="M320 250 Q360 170 445 165 Q495 168 510 205 Q465 270 395 275 Z" fill="url(#brooklynBlack)" stroke="#475569" stroke-width="2" />
      
      <!-- Tank Top Crease & Metallic Sheen Highlight -->
      <path d="M360 210 Q420 175 480 180" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      <ellipse cx="440" cy="172" rx="14" ry="5" fill="#1e293b" stroke="#94a3b8" stroke-width="1" />
      
      <!-- Extended Aggressive Tank Shroud / Fairing Wing -->
      <path d="M420 180 L520 190 L535 255 L450 270 Z" fill="url(#tankShroud)" stroke="#374151" stroke-width="1.5" />
      
      <!-- Pulsar 3D Chrome Branding Emblem on Tank -->
      <text x="445" y="215" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#f8fafc" letter-spacing="3" transform="rotate(7 445 215)">
        PULSAR
      </text>

      <!-- Signature Red 'N' Arrow Slash Decal on Shroud -->
      <polygon points="460,225 520,232 505,245 450,238" fill="url(#pulsarRed)" />
      <text x="480" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="1" transform="rotate(6 480 240)">
        N 160
      </text>
    </g>

    <!-- 8. BI-FUNCTIONAL LED PROJECTOR HEADLAMP & WOLF-EYE DRLs -->
    <g id="headlamp-assembly">
      <!-- Headlamp Mask & Fairing -->
      <path d="M510 165 L570 175 L615 215 L570 245 L525 215 Z" fill="url(#brooklynBlack)" stroke="#334155" stroke-width="2" />
      
      <!-- Wolf-Eye LED DRL Brow (Glowing Pure White / Neon Cyan) -->
      <path d="M545 180 L590 192 L575 200 L540 190 Z" fill="#ffffff" filter="url(#laserGlow)" />
      <path d="M545 180 L590 192 L575 200 L540 190 Z" fill="#38bdf8" opacity="0.8" />
      
      <!-- High-Intensity Bi-LED Projector Lens (Center Eye) -->
      <circle cx="590" cy="220" r="16" fill="#040608" stroke="#475569" stroke-width="2" />
      <circle cx="590" cy="220" r="11" fill="#0284c7" filter="url(#laserGlow)" />
      <circle cx="590" cy="220" r="6" fill="#ffffff" />
      
      <!-- Clip-on Handlebars, Brake Lever & Bar-End Mirrors -->
      <path d="M480 155 L525 145 L540 155" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
      <line x1="495" y1="145" x2="475" y2="120" stroke="#334155" stroke-width="2.5" />
      <ellipse cx="470" cy="115" rx="10" ry="6" fill="#0f172a" stroke="#475569" />
    </g>
  </g>

  <!-- ================= BOTTOM EMBLEM PILL (MATCHING VIDEO EXACTLY) ================= -->
  <g transform="translate(400, 505)">
    <!-- Beveled Dark Enclosure -->
    <rect x="-190" y="-22" width="380" height="44" rx="14" fill="#080b10" stroke="#f59e0b" stroke-width="1.8" />
    
    <!-- Red Dual ABS Tag -->
    <rect x="75" y="-12" width="95" height="24" rx="6" fill="url(#pulsarRed)" />
    <text x="122" y="4" text-anchor="middle" font-family="monospace" font-weight="900" font-size="11" fill="#ffffff" letter-spacing="1">
      DUAL ABS
    </text>

    <!-- Main BAJAJ PULSAR N160 text -->
    <text x="-50" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="3">
      BAJAJ PULSAR <tspan fill="#f59e0b">N160</tspan>
    </text>
  </g>
</svg>
