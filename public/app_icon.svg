<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Outer Background Gradient -->
    <radialGradient id="outerBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#040508" />
    </radialGradient>

    <!-- Inner Metallic Badge Background -->
    <radialGradient id="innerBadgeBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#101522" />
      <stop offset="60%" stop-color="#090c13" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Polished Automotive Gold Bevel Gradient -->
    <linearGradient id="goldBevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="20%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#b45309" />
      <stop offset="70%" stop-color="#fcd34d" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Crimson Nitro Red Gradient -->
    <linearGradient id="redTagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4455" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Laser Cyan Neon Glow Gradient -->
    <linearGradient id="cyanNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softLaserGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadowBadge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.95" />
    </filter>
  </defs>

  <!-- ================= 1. BASE APP CONTAINER (OUTER SQUIRCLE) ================= -->
  <rect width="512" height="512" rx="128" fill="#040508" />
  
  <!-- Outer Soft Beveled Base Plate (as in photo) -->
  <rect width="472" height="472" x="20" y="20" rx="108" fill="url(#outerBg)" stroke="#222a3a" stroke-width="2.5" />
  <rect width="472" height="472" x="20" y="20" rx="108" fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- ================= 2. INNER GOLD-BEVELED BADGE ================= -->
  <g filter="url(#dropShadowBadge)">
    <!-- Inner Squircle Frame with Rich Gold Bevel -->
    <rect width="376" height="376" x="68" y="68" rx="84" fill="url(#innerBadgeBg)" stroke="url(#goldBevelGrad)" stroke-width="7" />
    <rect width="364" height="364" x="74" y="74" rx="78" fill="none" stroke="#000000" stroke-width="3" opacity="0.8" />
    <rect width="356" height="356" x="78" y="78" rx="74" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />

    <!-- Subtle High-Tech Micro Dotted Grid inside Badge -->
    <g opacity="0.12" fill="#94a3b8">
      <!-- Horizontal dot rows -->
      <circle cx="120" cy="120" r="1.5" /><circle cx="160" cy="120" r="1.5" /><circle cx="200" cy="120" r="1.5" /><circle cx="240" cy="120" r="1.5" /><circle cx="280" cy="120" r="1.5" /><circle cx="320" cy="120" r="1.5" /><circle cx="360" cy="120" r="1.5" /><circle cx="400" cy="120" r="1.5" />
      <circle cx="120" cy="150" r="1.5" /><circle cx="160" cy="150" r="1.5" /><circle cx="200" cy="150" r="1.5" /><circle cx="240" cy="150" r="1.5" /><circle cx="280" cy="150" r="1.5" /><circle cx="320" cy="150" r="1.5" /><circle cx="360" cy="150" r="1.5" /><circle cx="400" cy="150" r="1.5" />
      <circle cx="120" cy="180" r="1.5" /><circle cx="160" cy="180" r="1.5" /><circle cx="200" cy="180" r="1.5" /><circle cx="240" cy="180" r="1.5" /><circle cx="280" cy="180" r="1.5" /><circle cx="320" cy="180" r="1.5" /><circle cx="360" cy="180" r="1.5" /><circle cx="400" cy="180" r="1.5" />
      <circle cx="120" cy="210" r="1.5" /><circle cx="160" cy="210" r="1.5" /><circle cx="200" cy="210" r="1.5" /><circle cx="240" cy="210" r="1.5" /><circle cx="280" cy="210" r="1.5" /><circle cx="320" cy="210" r="1.5" /><circle cx="360" cy="210" r="1.5" /><circle cx="400" cy="210" r="1.5" />
      <circle cx="120" cy="240" r="1.5" /><circle cx="160" cy="240" r="1.5" /><circle cx="200" cy="240" r="1.5" /><circle cx="240" cy="240" r="1.5" /><circle cx="280" cy="240" r="1.5" /><circle cx="320" cy="240" r="1.5" /><circle cx="360" cy="240" r="1.5" /><circle cx="400" cy="240" r="1.5" />
      <circle cx="120" cy="270" r="1.5" /><circle cx="160" cy="270" r="1.5" /><circle cx="200" cy="270" r="1.5" /><circle cx="240" cy="270" r="1.5" /><circle cx="280" cy="270" r="1.5" /><circle cx="320" cy="270" r="1.5" /><circle cx="360" cy="270" r="1.5" /><circle cx="400" cy="270" r="1.5" />
    </g>

    <!-- Center Cyan Projector Ambient Halo -->
    <circle cx="256" cy="220" r="85" fill="#0284c7" opacity="0.25" filter="url(#softLaserGlow)" />
  </g>

  <!-- ================= 3. STYLIZED PULSAR N160 HEADLAMP VISOR ================= -->
  <g transform="translate(0, -2)">
    
    <!-- Outer Aerodynamic Headlamp Mask -->
    <path d="M190 148 L322 148 L352 195 L310 270 L256 312 L202 270 L160 195 Z" fill="#0d111a" stroke="#253245" stroke-width="3" />

    <!-- Smoked Angular Windscreen Visor (Top Hexagon Facet) -->
    <polygon points="208,154 304,154 322,185 256,198 190,185" fill="#141926" stroke="#475569" stroke-width="2" />
    <polygon points="225,158 287,158 298,176 256,185 214,176" fill="#1e2738" opacity="0.7" />

    <!-- Left & Right Red Accent Winglet / Intake Ducts (as in user photo) -->
    <polygon points="166,215 186,228 178,252 158,238" fill="#120608" stroke="#ef4444" stroke-width="2.5" />
    <polygon points="346,215 326,228 334,252 354,238" fill="#120608" stroke="#ef4444" stroke-width="2.5" />

    <!-- Left Cyan Glowing Wolf-Eye LED DRL Brow -->
    <path d="M182 200 Q220 210 240 242 L232 248 Q212 222 174 210 Z" fill="#ffffff" filter="url(#laserGlow)" />
    <path d="M182 200 Q220 210 240 242 L232 248 Q212 222 174 210 Z" fill="url(#cyanNeonGrad)" opacity="0.9" />

    <!-- Right Cyan Glowing Wolf-Eye LED DRL Brow -->
    <path d="M330 200 Q292 210 272 242 L280 248 Q300 222 338 210 Z" fill="#ffffff" filter="url(#laserGlow)" />
    <path d="M330 200 Q292 210 272 242 L280 248 Q300 222 338 210 Z" fill="url(#cyanNeonGrad)" opacity="0.9" />

    <!-- Central Bi-LED Projector Lens Assembly -->
    <circle cx="256" cy="262" r="28" fill="#06090e" stroke="#334155" stroke-width="3" />
    <circle cx="256" cy="262" r="21" fill="#0284c7" filter="url(#laserGlow)" />
    <circle cx="256" cy="262" r="14" fill="#38bdf8" />
    <circle cx="256" cy="262" r="7" fill="#ffffff" />
    <circle cx="252" cy="258" r="3" fill="#ffffff" />
  </g>

  <!-- ================= 4. "PULSAR" BOLD TYPOGRAPHY ================= -->
  <text x="256" y="362" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="7" filter="url(#laserGlow)">
    PULSAR
  </text>
  <text x="256" y="362" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="7">
    PULSAR
  </text>

  <!-- ================= 5. "N160 | ABS 2CH" BOTTOM PILL BADGE (MATCHING USER PHOTO) ================= -->
  <g transform="translate(256, 404)">
    <!-- Pill Enclosure with Gold Beveled Stroke -->
    <rect x="-110" y="-20" width="220" height="40" rx="14" fill="#0b0e16" stroke="url(#goldBevelGrad)" stroke-width="2.2" />
    
    <!-- Left: N160 Bold Gold Typography -->
    <text x="-32" y="9" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" fill="#f59e0b" letter-spacing="2.5">
      N160
    </text>

    <!-- Right: ABS 2CH Crimson Red Tag -->
    <rect x="24" y="-12" width="70" height="24" rx="6" fill="url(#redTagGrad)" />
    <text x="59" y="4.5" text-anchor="middle" font-family="monospace" font-weight="900" font-size="10.5" fill="#ffffff" letter-spacing="1">
      ABS 2CH
    </text>
  </g>

  <!-- Top Subtle Metallic Highlight -->
  <path d="M120 72 Q256 62 392 72" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.35" />
</svg>
